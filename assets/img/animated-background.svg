<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Advanced Gradients -->
    <linearGradient id="primaryFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1">
        <animate attributeName="stop-color" values="#ffffff;#fefefe;#f9e8ea;#ffffff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#fefefe;stop-opacity:1">
        <animate attributeName="stop-color" values="#fefefe;#f9e8ea;#f4d4d6;#fefefe" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f4d4d6;stop-opacity:1">
        <animate attributeName="stop-color" values="#f4d4d6;#f9e8ea;#fefefe;#f4d4d6" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="flowingGradient1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#d19ca1;stop-opacity:0.12">
        <animate attributeName="stop-opacity" values="0.12;0.18;0.08;0.12" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#e8b4a6;stop-opacity:0.08">
        <animate attributeName="stop-opacity" values="0.08;0.15;0.05;0.08" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f4d4d6;stop-opacity:0.04">
        <animate attributeName="stop-opacity" values="0.04;0.08;0.02;0.04" dur="10s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 50 50;360 50 50" dur="20s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="flowingGradient2" cx="70%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.10">
        <animate attributeName="stop-opacity" values="0.10;0.16;0.06;0.10" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#c28489;stop-opacity:0.06">
        <animate attributeName="stop-opacity" values="0.06;0.12;0.04;0.06" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f9e8ea;stop-opacity:0.03">
        <animate attributeName="stop-opacity" values="0.03;0.06;0.02;0.03" dur="11s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" values="360 50 50;0 50 50" dur="25s" repeatCount="indefinite"/>
    </radialGradient>

    <!-- Dynamic patterns -->
    <pattern id="dynamicDots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#d19ca1" opacity="0.04">
        <animate attributeName="r" values="1.5;2.5;1;1.5" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.04;0.08;0.02;0.04" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="15" r="1" fill="#e8b4a6" opacity="0.03">
        <animate attributeName="r" values="1;2;0.5;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.03;0.06;0.01;0.03" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="45" cy="45" r="1.2" fill="#c28489" opacity="0.04">
        <animate attributeName="r" values="1.2;2.2;0.8;1.2" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.04;0.07;0.02;0.04" dur="8s" repeatCount="indefinite"/>
      </circle>
    </pattern>

    <!-- Blur filters for depth -->
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Animated base background -->
  <rect width="100%" height="100%" fill="url(#primaryFlow)"/>

  <!-- Dynamic texture overlay -->
  <rect width="100%" height="100%" fill="url(#dynamicDots)">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,5;0,0" dur="20s" repeatCount="indefinite"/>
  </rect>

  <!-- Large flowing background elements -->
  <ellipse cx="200" cy="150" rx="180" ry="120" fill="url(#flowingGradient1)" opacity="0.8" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="rotate" values="0 200 150;360 200 150" dur="30s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="180;220;160;180" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="120;140;100;120" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1600" cy="900" rx="220" ry="150" fill="url(#flowingGradient2)" opacity="0.7" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="rotate" values="360 1600 900;0 1600 900" dur="35s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="220;260;200;220" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="150;170;130;150" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating geometric shapes with complex animations -->
  <g opacity="0.6">
    <!-- Top area floating elements -->
    <polygon points="150,80 250,60 280,140 180,160" fill="#d19ca1" opacity="0.08" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0 215 110;360 215 110" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.15;0.05;0.08" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;15,10;-10,5;0,0" dur="12s" repeatCount="indefinite" additive="sum"/>
    </polygon>

    <circle cx="320" cy="180" r="35" fill="#d4af37" opacity="0.12">
      <animate attributeName="r" values="35;45;25;35" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.20;0.08;0.12" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;20,-15;-15,10;0,0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Right side dynamic elements -->
    <rect x="1500" y="100" width="80" height="80" rx="15" fill="#c28489" opacity="0.10">
      <animateTransform attributeName="transform" type="rotate" values="0 1540 140;180 1540 140;360 1540 140" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="width" values="80;100;60;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;100;60;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.18;0.06;0.10" dur="7s" repeatCount="indefinite"/>
    </rect>

    <polygon points="1650,180 1720,160 1740,220 1670,240" fill="#e8b4a6" opacity="0.12">
      <animateTransform attributeName="transform" type="rotate" values="0 1695 200;-360 1695 200" dur="28s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.2;0.8;1" dur="15s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.12;0.22;0.08;0.12" dur="9s" repeatCount="indefinite"/>
    </polygon>

    <!-- Left side flowing elements -->
    <circle cx="120" cy="450" r="25" fill="#b07378" opacity="0.15">
      <animate attributeName="r" values="25;35;20;25" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;25,15;-20,-10;0,0" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.25;0.10;0.15" dur="8s" repeatCount="indefinite"/>
    </circle>

    <rect x="80" y="520" width="60" height="100" rx="30" fill="#d19ca1" opacity="0.08">
      <animateTransform attributeName="transform" type="rotate" values="0 110 570;180 110 570;0 110 570" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="width" values="60;80;50;60" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.16;0.05;0.08" dur="11s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom floating elements -->
    <ellipse cx="600" cy="850" rx="50" ry="30" fill="#d4af37" opacity="0.10">
      <animateTransform attributeName="transform" type="rotate" values="0 600 850;360 600 850" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="50;70;40;50" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="30;40;25;30" dur="15s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;30,-20;-25,15;0,0" dur="20s" repeatCount="indefinite" additive="sum"/>
    </ellipse>

    <circle cx="1400" cy="950" r="40" fill="#e8b4a6" opacity="0.12">
      <animate attributeName="r" values="40;55;30;40" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-30,20;20,-15;0,0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.22;0.08;0.12" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dynamic flowing curves -->
  <g opacity="0.25" fill="none" stroke-width="2">
    <path d="M 50,300 Q 400,280 800,320 T 1500,280" stroke="#d19ca1" opacity="0.15">
      <animate attributeName="d" values="M 50,300 Q 400,280 800,320 T 1500,280;M 50,320 Q 400,260 800,340 T 1500,260;M 50,300 Q 400,280 800,320 T 1500,280" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.25;0.10;0.15" dur="8s" repeatCount="indefinite"/>
    </path>

    <path d="M 100,600 Q 500,580 900,620 T 1600,580" stroke="#c28489" opacity="0.12">
      <animate attributeName="d" values="M 100,600 Q 500,580 900,620 T 1600,580;M 100,620 Q 500,560 900,640 T 1600,560;M 100,600 Q 500,580 900,620 T 1600,580" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.20;0.08;0.12" dur="10s" repeatCount="indefinite"/>
    </path>

    <path d="M 200,800 Q 600,780 1000,820 T 1700,780" stroke="#e8b4a6" opacity="0.10">
      <animate attributeName="d" values="M 200,800 Q 600,780 1000,820 T 1700,780;M 200,820 Q 600,760 1000,840 T 1700,760;M 200,800 Q 600,780 1000,820 T 1700,780" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.18;0.06;0.10" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating particles -->
  <g opacity="0.3">
    <circle cx="960" cy="200" r="8" fill="#d4af37">
      <animateTransform attributeName="transform" type="translate" values="0,0;50,30;-30,60;20,-40;0,0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;12;5;8" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.2;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="300" cy="400" r="6" fill="#e8b4a6">
      <animateTransform attributeName="transform" type="translate" values="0,0;-40,25;30,-35;-15,45;0,0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;10;4;6" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.4;0.2;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1500" cy="700" r="10" fill="#d19ca1">
      <animateTransform attributeName="transform" type="translate" values="0,0;35,-45;-25,20;40,35;0,0" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;15;7;10" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.2;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="500" r="5" fill="#c28489">
      <animateTransform attributeName="transform" type="translate" values="0,0;-30,40;25,-30;-35,-20;0,0" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;8;3;5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.4;0.2;0.3" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1200" cy="300" r="7" fill="#b07378">
      <animateTransform attributeName="transform" type="translate" values="0,0;45,20;-20,50;30,-35;0,0" dur="28s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;11;4;7" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.2;0.3" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pulse waves -->
  <g opacity="0.1">
    <circle cx="960" cy="540" r="50" fill="none" stroke="#d19ca1" stroke-width="1">
      <animate attributeName="r" values="50;200;50" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="15s" repeatCount="indefinite"/>
    </circle>

    <circle cx="960" cy="540" r="50" fill="none" stroke="#e8b4a6" stroke-width="1">
      <animate attributeName="r" values="50;200;50" dur="15s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="15s" begin="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="960" cy="540" r="50" fill="none" stroke="#c28489" stroke-width="1">
      <animate attributeName="r" values="50;200;50" dur="15s" begin="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="15s" begin="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Soft overlay for cohesion -->
  <rect width="100%" height="100%" fill="url(#primaryFlow)" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.25;0.10;0.15" dur="20s" repeatCount="indefinite"/>
  </rect>
</svg>