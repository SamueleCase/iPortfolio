<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#fefefe;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f9e8ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4d4d6;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="accentGradient1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#d19ca1;stop-opacity:0.08" />
      <stop offset="50%" style="stop-color:#e8b4a6;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#f4d4d6;stop-opacity:0.02" />
    </radialGradient>

    <radialGradient id="accentGradient2" cx="70%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.06" />
      <stop offset="50%" style="stop-color:#c28489;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#f9e8ea;stop-opacity:0.02" />
    </radialGradient>

    <linearGradient id="shapeGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d19ca1;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#e8b4a6;stop-opacity:0.08" />
    </linearGradient>

    <linearGradient id="shapeGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c28489;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#b07378;stop-opacity:0.06" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.03" />
      <stop offset="100%" style="stop-color:#e8b4a6;stop-opacity:0.05" />
    </linearGradient>

    <!-- Filters for subtle effects -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <!-- Pattern for subtle texture -->
    <pattern id="dotsPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#d19ca1" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#primaryGradient)"/>

  <!-- Subtle texture overlay -->
  <rect width="100%" height="100%" fill="url(#dotsPattern)"/>

  <!-- Large background shapes -->
  <ellipse cx="200" cy="150" rx="180" ry="120" fill="url(#accentGradient1)" opacity="0.6" transform="rotate(-15)"/>
  <ellipse cx="1600" cy="900" rx="220" ry="150" fill="url(#accentGradient2)" opacity="0.5" transform="rotate(25)"/>

  <!-- Floating geometric shapes -->
  <g opacity="0.4">
    <!-- Top left area -->
    <polygon points="150,80 250,60 280,140 180,160" fill="url(#shapeGradient1)" transform="rotate(-12 215 110)"/>
    <circle cx="320" cy="180" r="35" fill="url(#goldAccent)" opacity="0.6"/>

    <!-- Top right area -->
    <rect x="1500" y="100" width="80" height="80" rx="15" fill="url(#shapeGradient2)" transform="rotate(20 1540 140)"/>
    <polygon points="1650,180 1720,160 1740,220 1670,240" fill="url(#shapeGradient1)" transform="rotate(-8 1695 200)"/>

    <!-- Middle left -->
    <circle cx="120" cy="450" r="25" fill="url(#goldAccent)" opacity="0.5"/>
    <rect x="80" y="520" width="60" height="100" rx="30" fill="url(#shapeGradient2)" transform="rotate(15 110 570)"/>

    <!-- Middle right -->
    <polygon points="1720,400 1800,420 1780,480 1700,460" fill="url(#shapeGradient1)" transform="rotate(25 1750 440)"/>
    <circle cx="1650" cy="550" r="40" fill="url(#accentGradient1)" opacity="0.5"/>

    <!-- Bottom left -->
    <rect x="200" y="850" width="90" height="70" rx="20" fill="url(#goldAccent)" transform="rotate(-20 245 885)" opacity="0.4"/>
    <circle cx="100" cy="950" r="30" fill="url(#shapeGradient2)" opacity="0.6"/>

    <!-- Bottom right -->
    <polygon points="1580,850 1650,830 1670,890 1600,910" fill="url(#shapeGradient1)" transform="rotate(12 1625 870)"/>
    <rect x="1450" y="920" width="70" height="70" rx="35" fill="url(#accentGradient2)" transform="rotate(-5 1485 955)" opacity="0.5"/>
  </g>

  <!-- Subtle flowing lines -->
  <g opacity="0.15" fill="none" stroke="#d19ca1" stroke-width="1.5">
    <path d="M 50,300 Q 400,280 800,320 T 1500,280" />
    <path d="M 100,600 Q 500,580 900,620 T 1600,580" opacity="0.8"/>
    <path d="M 200,800 Q 600,780 1000,820 T 1700,780" opacity="0.6"/>
  </g>

  <!-- Additional floating elements for depth -->
  <g opacity="0.25">
    <ellipse cx="600" cy="250" rx="45" ry="25" fill="#e8b4a6" transform="rotate(30 600 250)"/>
    <ellipse cx="1200" cy="600" rx="55" ry="30" fill="#d19ca1" transform="rotate(-25 1200 600)"/>
    <ellipse cx="400" cy="750" rx="35" ry="20" fill="#c28489" transform="rotate(45 400 750)"/>
    <ellipse cx="1400" cy="350" rx="40" ry="25" fill="#b07378" transform="rotate(-35 1400 350)"/>
  </g>

  <!-- Soft overlay for depth -->
  <rect width="100%" height="100%" fill="url(#primaryGradient)" opacity="0.1"/>

  <!-- Animated elements (optional) -->
  <g opacity="0.1">
    <circle cx="960" cy="200" r="8" fill="#d4af37">
      <animate attributeName="cy" values="200;220;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="400" r="6" fill="#e8b4a6">
      <animate attributeName="cx" values="300;320;300" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.15;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="700" r="10" fill="#d19ca1">
      <animate attributeName="cy" values="700;680;700" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>